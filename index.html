<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>Tic Tac Toe - Cyber Neon Wave Edition</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Orbitron:wght@600;800;900&family=Rajdhani:wght@600;700&display=swap');

    :root {
      --bg-dark: #04010d;
      --card-bg: rgba(12, 7, 26, 0.78);
      --cyan-neon: #00f0ff;
      --cyan-glow: rgba(0, 240, 255, 0.65);
      --magenta-neon: #d000ff;
      --magenta-glow: rgba(208, 0, 255, 0.65);
      --player-x: #ffe600;
      --player-x-glow: rgba(255, 230, 0, 0.85);
      --player-o: #00f0ff;
      --player-o-glow: rgba(0, 240, 255, 0.85);
      --text-main: #ffffff;
      --text-sub: #b2a1d4;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Rajdhani', sans-serif;
      touch-action: manipulation;
      user-select: none;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 15px;
      position: relative;
      overflow: hidden;
    }

    .bg-waves-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none;
      overflow: hidden;
    }

    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .wave-svg {
      position: absolute;
      width: 170%;
      height: 170%;
      top: -35%;
      left: -35%;
      filter: blur(14px);
      opacity: 0.88;
      animation: waveRotate 22s ease-in-out infinite alternate;
    }

    @keyframes waveRotate {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(10deg) scale(1.12); }
      100% { transform: rotate(-7deg) scale(1.04); }
    }

    .glow-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(90px);
      z-index: 0;
      pointer-events: none;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .orb-cyan {
      width: 320px;
      height: 320px;
      background: rgba(0, 240, 255, 0.28);
      top: 5%;
      left: 5%;
    }

    .orb-magenta {
      width: 380px;
      height: 380px;
      background: rgba(208, 0, 255, 0.28);
      bottom: 5%;
      right: 5%;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      100% { transform: translate(45px, -35px) scale(1.22); }
    }

    .audio-btn {
      position: fixed;
      top: 18px;
      right: 18px;
      z-index: 10;
      background: rgba(15, 8, 32, 0.8);
      border: 1px solid var(--cyan-neon);
      color: var(--cyan-neon);
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 0 15px var(--cyan-glow);
      transition: all 0.3s ease;
      font-size: 1.1rem;
    }

    .audio-btn:hover {
      transform: scale(1.1);
      box-shadow: 0 0 25px var(--cyan-glow);
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 390px;
      background: var(--card-bg);
      padding: 30px 22px;
      border-radius: 28px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 240, 255, 0.25), inset 0 0 20px rgba(208, 0, 255, 0.2);
      border: 1px solid rgba(0, 240, 255, 0.35);
      text-align: center;
      position: relative;
      z-index: 2;
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      animation: screenFadeIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .screen.active {
      display: block;
    }

    @keyframes screenFadeIn {
      from { opacity: 0; transform: scale(0.9) translateY(20px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }

    h1 {
      font-family: 'Orbitron', sans-serif;
      font-size: 2.1rem;
      font-weight: 900;
      margin-bottom: 4px;
      letter-spacing: 2px;
      text-transform: uppercase;
      background: linear-gradient(135deg, #ffffff 0%, var(--cyan-neon) 50%, var(--magenta-neon) 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 14px var(--cyan-glow));
    }

    .subtitle {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-bottom: 24px;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .menu-options {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .difficulty-picker {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .diff-btn {
      padding: 8px 16px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--text-sub);
      border: 1px solid rgba(255, 255, 255, 0.2);
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .diff-btn.active {
      background: rgba(0, 240, 255, 0.2);
      color: var(--cyan-neon);
      border-color: var(--cyan-neon);
      box-shadow: 0 0 12px var(--cyan-glow);
    }

    .menu-btn {
      padding: 16px 20px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      border-radius: 16px;
      cursor: pointer;
      background: rgba(10, 20, 40, 0.65);
      color: #ffffff;
      border: 1.5px solid var(--cyan-neon);
      box-shadow: 0 0 18px rgba(0, 240, 255, 0.25), inset 0 0 10px rgba(0, 240, 255, 0.1);
      transition: all 0.3s ease;
    }

    .menu-btn:hover, .menu-btn:active {
      background: linear-gradient(135deg, var(--cyan-neon), var(--magenta-neon));
      border-color: #ffffff;
      box-shadow: 0 0 32px var(--cyan-glow), 0 0 18px var(--magenta-glow);
      transform: translateY(-2px) scale(1.02);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .back-btn {
      background: none;
      border: none;
      color: var(--text-sub);
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      transition: color 0.2s;
    }

    .back-btn:hover {
      color: var(--cyan-neon);
    }

    .scoreboard {
      display: flex;
      justify-content: space-between;
      background: rgba(6, 3, 16, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 8px 16px;
      margin-bottom: 16px;
    }

    .score-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .score-label {
      font-size: 0.7rem;
      color: var(--text-sub);
      font-weight: 700;
      text-transform: uppercase;
    }

    .score-val {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.1rem;
      font-weight: 900;
    }

    .status {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.05rem;
      margin-bottom: 18px;
      font-weight: 800;
      min-height: 28px;
    }

    /* Board & Cells */
    .board-wrapper {
      position: relative;
      width: 100%;
      margin-bottom: 20px;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .cell {
      aspect-ratio: 1;
      width: 100%;
      background: rgba(18, 10, 38, 0.75);
      border: 1.5px solid rgba(0, 240, 255, 0.28);
      border-radius: 18px;
      font-family: 'Orbitron', sans-serif;
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: inset 0 0 12px rgba(0, 0, 0, 0.6);
      -webkit-tap-highlight-color: transparent;
    }

    .cell:hover:not(:disabled) {
      background: rgba(32, 16, 58, 0.9);
      border-color: var(--cyan-neon);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45);
      transform: translateY(-3px) scale(1.02);
    }

    .cell.pop {
      animation: cellPop 0.25s ease-out;
    }

    @keyframes cellPop {
      0% { transform: scale(0.8); }
      50% { transform: scale(1.15); }
      100% { transform: scale(1); }
    }

    .cell.x, .player-x {
      color: var(--player-x);
      text-shadow: 0 0 16px var(--player-x-glow);
    }

    .cell.o, .player-o {
      color: var(--player-o);
      text-shadow: 0 0 16px var(--player-o-glow);
    }

    .winning-line {
      position: absolute;
      background: linear-gradient(90deg, #ffe600, #00f0ff, #d000ff);
      height: 6px;
      border-radius: 4px;
      box-shadow: 0 0 18px #00f0ff, 0 0 28px #d000ff;
      transform-origin: center left;
      z-index: 5;
      pointer-events: none;
      width: 0;
      transition: width 0.4s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .restart-btn {
      width: 100%;
      padding: 15px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.95rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 1px;
      background: linear-gradient(135deg, rgba(208, 0, 255, 0.85), rgba(0, 240, 255, 0.85));
      color: #ffffff;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      box-shadow: 0 0 22px var(--magenta-glow);
      transition: all 0.25s ease;
    }

    .restart-btn:hover, .restart-btn:active {
      box-shadow: 0 0 32px var(--cyan-glow);
      transform: translateY(-2px);
    }

    .winner-card {
      background: rgba(14, 5, 30, 0.94);
      border: 1.5px solid var(--magenta-neon);
      box-shadow: 0 0 50px var(--magenta-glow);
      padding: 35px 22px;
    }

    .winner-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .winner-msg {
      font-size: 1.25rem;
      margin-bottom: 25px;
      font-weight: 700;
    }

    .dialog-text {
      font-size: 1.05rem;
      color: var(--text-sub);
      margin-bottom: 22px;
      font-weight: 700;
    }

    .action-btn-group {
      display: flex;
      gap: 12px;
    }

    .action-btn {
      flex: 1;
      padding: 14px 10px;
      font-family: 'Orbitron', sans-serif;
      font-size: 0.85rem;
      font-weight: 800;
      text-transform: uppercase;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .btn-yes {
      background: linear-gradient(135deg, var(--cyan-neon), #0066ff);
      color: #fff;
      box-shadow: 0 0 20px var(--cyan-glow);
    }

    .btn-yes:hover {
      box-shadow: 0 0 30px var(--cyan-glow);
      transform: translateY(-2px);
    }

    .btn-no {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .btn-no:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .developer-tag {
      position: fixed;
      bottom: 10px;
      right: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-sub);
      background: rgba(8, 3, 18, 0.88);
      padding: 5px 10px;
      border-radius: 16px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.9);
      white-space: nowrap;
      z-index: 10;
    }

    .designer-signature {
      color: #ffffff;
      margin: 0 2px;
    }

    .rights-text {
      font-size: 0.55rem;
      opacity: 0.6;
      margin-left: 3px;
    }
  </style>
</head>
<body>

  <button class="audio-btn" id="audioToggle" onclick="toggleAudio()">🔊</button>

  <div class="bg-waves-container">
    <canvas id="particleCanvas"></canvas>
    <div class="glow-orb orb-cyan"></div>
    <div class="glow-orb orb-magenta"></div>
    <svg class="wave-svg" viewBox="0 0 800 800" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#00f0ff" />
          <stop offset="100%" stop-color="#0066ff" />
        </linearGradient>
        <linearGradient id="gradMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#d000ff" />
          <stop offset="100%" stop-color="#7900ff" />
        </linearGradient>
      </defs>
      <path d="M 80 320 Q 260 140 420 320 T 720 320" fill="none" stroke="url(#gradCyan)" stroke-width="10" />
      <path d="M 40 420 Q 260 240 480 460 T 780 360" fill="none" stroke="url(#gradMagenta)" stroke-width="14" />
      <path d="M 140 180 Q 360 480 580 180 T 780 520" fill="none" stroke="#00f0ff" stroke-dasharray="18 12" stroke-width="5" />
    </svg>
  </div>

  <div id="menuScreen" class="screen active">
    <h1>Tic Tac Toe</h1>
    <p class="subtitle">Select Mode & Difficulty</p>

    <div class="difficulty-picker">
      <button class="diff-btn" id="diffEasy" onclick="setDifficulty('easy')">Casual</button>
      <button class="diff-btn active" id="diffMaster" onclick="setDifficulty('master')">Cyber Master</button>
    </div>

    <div class="menu-options">
      <button class="menu-btn" onclick="startGame('pvc')">Computer vs Me</button>
      <button class="menu-btn" onclick="startGame('pvp')">Player vs Player</button>
    </div>
  </div>

  <div id="gameScreen" class="screen">
    <div class="header-bar">
      <button class="back-btn" onclick="showMenu()">← Mode Select</button>
    </div>

    <div class="scoreboard">
      <div class="score-item">
        <span class="score-label">Player (X)</span>
        <span class="score-val player-x" id="scoreX">0</span>
      </div>
      <div class="score-item">
        <span class="score-label">Ties</span>
        <span class="score-val" id="scoreTies">0</span>
      </div>
      <div class="score-item">
        <span class="score-label" id="labelO">Player (O)</span>
        <span class="score-val player-o" id="scoreO">0</span>
      </div>
    </div>

    <div id="status" class="status">Player <span class="player-x">X</span>'s turn</div>

    <div class="board-wrapper" id="boardWrapper">
      <div id="winningLine" class="winning-line"></div>
      <div class="board" id="board">
        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>
        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>
        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>
      </div>
    </div>

    <button id="restartBtn" class="restart-btn" onclick="resetBoardOnly()">Restart Game</button>
  </div>

  <div id="winnerScreen" class="screen winner-card">
    <div id="wTitle" class="winner-title">VICTORY!</div>
    <div id="wMsg" class="winner-msg">Player X Wins!</div>
    
    <div class="dialog-text">Do you want to continue the game?</div>

    <div class="action-btn-group">
      <button class="action-btn btn-yes" onclick="continueGame()">Yes</button>
      <button class="action-btn btn-no" onclick="showMenu()">No</button>
    </div>
  </div>

  <div class="developer-tag">
    Developed by <span class="designer-signature">Harsh Pandey</span> <span class="rights-text">All Rights Reserved</span>
  </div>

  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;
    let soundMuted = false;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function toggleAudio() {
      soundMuted = !soundMuted;
      document.getElementById('audioToggle').textContent = soundMuted ? '🔇' : '🔊';
    }

    function playSound(type) {
      if (soundMuted) return;
      initAudio();
      if (!audioCtx) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'click') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(550, now);
        osc.frequency.exponentialRampToValueAtTime(180, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'x') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(400, now);
        osc.frequency.exponentialRampToValueAtTime(800, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'o') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(850, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.12);
        gain.gain.setValueAtTime(0.25, now);
        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'win') {
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const o = audioCtx.createOscillator();
          const g = audioCtx.createGain();
          o.connect(g);
          g.connect(audioCtx.destination);
          o.type = 'sine';
          o.frequency.value = freq;
          g.gain.setValueAtTime(0.2, now + idx * 0.09);
          g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.09 + 0.32);
          o.start(now + idx * 0.09);
          o.stop(now + idx * 0.09 + 0.32);
        });
      }
    }

    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 40; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        radius: Math.random() * 2 + 0.5,
        color: Math.random() > 0.5 ? '#00f0ff' : '#d000ff',
        vx: (Math.random() - 0.5) * 0.4,
        vy: -Math.random() * 0.6 - 0.2,
        alpha: Math.random() * 0.6 + 0.2
      });
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        if (p.y < 0) p.y = canvas.height;
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;

        ctx.save();
        ctx.globalAlpha = p.alpha;
        ctx.fillStyle = p.color;
        ctx.shadowBlur = 8;
        ctx.shadowColor = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });
      requestAnimationFrame(animateParticles);
    }
    animateParticles();

    const menuScreen = document.getElementById('menuScreen');
    const gameScreen = document.getElementById('gameScreen');
    const winnerScreen = document.getElementById('winnerScreen');
    const cells = document.querySelectorAll('.cell');
    const statusText = document.getElementById('status');
    const winningLine = document.getElementById('winningLine');
    const boardWrapper = document.getElementById('boardWrapper');

    const winPatterns = [
      [0, 1, 2], [3, 4, 5], [6, 7, 8],
      [0, 3, 6], [1, 4, 7], [2, 5, 8],
      [0, 4, 8], [2, 4, 6]
    ];

    let board = ["", "", "", "", "", "", "", "", ""];
    let currentPlayer = "X";
    let isGameActive = true;
    let gameMode = "pvp";
    let difficulty = "master";

    let scoreX = 0;
    let scoreO = 0;
    let scoreTies = 0;

    function setDifficulty(diff) {
      playSound('click');
      difficulty = diff;
      document.getElementById('diffEasy').classList.toggle('active', diff === 'easy');
      document.getElementById('diffMaster').classList.toggle('active', diff === 'master');
    }

    function startGame(mode) {
      playSound('click');
      gameMode = mode;
      document.getElementById('labelO').textContent = mode === 'pvc' ? 'Computer' : 'Player (O)';
      menuScreen.classList.remove('active');
      winnerScreen.classList.remove('active');
      gameScreen.classList.add('active');
      resetBoardOnly();
    }

    function showMenu() {
      playSound('click');
      gameScreen.classList.remove('active');
      winnerScreen.classList.remove('active');
      menuScreen.classList.add('active');
    }

    function resetBoardOnly() {
      board = ["", "", "", "", "", "", "", "", ""];
      currentPlayer = "X";
      isGameActive = true;
      winningLine.style.width = '0px';
      updateStatusText();

      cells.forEach(cell => {
        cell.textContent = "";
        cell.classList.remove('x', 'o', 'pop');
      });
    }

    function continueGame() {
      playSound('click');
      winnerScreen.classList.remove('active');
      gameScreen.classList.add('active');
      resetBoardOnly();
    }

    function handleCellClick(e) {
      const cell = e.target;
      const index = parseInt(cell.getAttribute('data-index'));

      if (board[index] !== "" || !isGameActive) return;

      makeMove(cell, index, currentPlayer);

      const winPattern = checkWinPattern(board, currentPlayer);

      if (winPattern) {
        handleWin(currentPlayer, winPattern);
        return;
      }

      if (checkDraw(board)) {
        handleDraw();
        return;
      }

      if (gameMode === 'pvp') {
        currentPlayer = currentPlayer === "X" ? "O" : "X";
        updateStatusText();
      } else if (gameMode === 'pvc') {
        currentPlayer = "O";
        updateStatusText("Computer thinking...");
        isGameActive = false;

        setTimeout(() => {
          makeComputerMove();
        }, 380);
      }
    }

    function makeMove(cell, index, player) {
      playSound(player.toLowerCase());
      board[index] = player;
      cell.textContent = player;
      cell.classList.add(player.toLowerCase(), 'pop');
    }

    function makeComputerMove() {
      let bestMove;

      if (difficulty === 'easy') {
        const available = board.map((v, i) => v === "" ? i : null).filter(v => v !== null);
        bestMove = available[Math.floor(Math.random() * available.length)];
      } else {
        bestMove = getBestMove(board);
      }

      const cell = cells[bestMove];
      makeMove(cell, bestMove, "O");

      const winPattern = checkWinPattern(board, "O");

      if (winPattern) {
        handleWin("O", winPattern);
        return;
      }

      if (checkDraw(board)) {
        handleDraw();
        return;
      }

      currentPlayer = "X";
      isGameActive = true;
      updateStatusText();
    }

    function handleWin(winner, pattern) {
      isGameActive = false;
      if (winner === 'X') scoreX++;
      else scoreO++;
      updateScoreDisplay();

      drawWinningLine(pattern);
      playSound('win');

      setTimeout(() => {
        showWinnerPage(winner);
      }, 950);
    }

    function handleDraw() {
      isGameActive = false;
      scoreTies++;
      updateScoreDisplay();

      setTimeout(() => {
        showWinnerPage("DRAW");
      }, 450);
    }

    function updateScoreDisplay() {
      document.getElementById('scoreX').textContent = scoreX;
      document.getElementById('scoreO').textContent = scoreO;
      document.getElementById('scoreTies').textContent = scoreTies;
    }

    function drawWinningLine(pattern) {
      const cellA = cells[pattern[0]].getBoundingClientRect();
      const cellC = cells[pattern[2]].getBoundingClientRect();
      const wrapperRect = boardWrapper.getBoundingClientRect();

      const x1 = cellA.left + cellA.width / 2 - wrapperRect.left;
      const y1 = cellA.top + cellA.height / 2 - wrapperRect.top;
      const x2 = cellC.left + cellC.width / 2 - wrapperRect.left;
      const y2 = cellC.top + cellC.height / 2 - wrapperRect.top;

      const distance = Math.hypot(x2 - x1, y2 - y1);
      const angle = Math.atan2(y2 - y1, x2 - x1) * (180 / Math.PI);

      winningLine.style.top = `${y1}px`;
      winningLine.style.left = `${x1}px`;
      winningLine.style.transform = `rotate(${angle}deg)`;
      
      setTimeout(() => {
        winningLine.style.width = `${distance}px`;
      }, 50);
    }

    function showWinnerPage(winner) {
      gameScreen.classList.remove('active');
      winnerScreen.classList.add('active');

      const titleEl = document.getElementById('wTitle');
      const msgEl = document.getElementById('wMsg');

      if (winner === "DRAW") {
        titleEl.textContent = "GAME DRAW!";
        titleEl.style.color = "#ffffff";
        msgEl.textContent = "It's a Tie! 🤝";
      } else {
        titleEl.textContent = "VICTORY!";
        titleEl.style.color = winner === "X" ? "var(--player-x)" : "var(--player-o)";
        if (gameMode === 'pvc') {
          msgEl.innerHTML = winner === "X" ? "🎉 You Defeated the Computer!" : "🤖 Computer Won the Match!";
        } else {
          const playerClass = winner === "X" ? "player-x" : "player-o";
          msgEl.innerHTML = `🎉 Player <span class="${playerClass}">${winner}</span> Wins!`;
        }
      }
    }

    function updateStatusText(customMessage) {
      if (customMessage) {
        statusText.textContent = customMessage;
        return;
      }
      const playerClass = currentPlayer === "X" ? "player-x" : "player-o";
      const label = (gameMode === 'pvc' && currentPlayer === "X") ? "Your Turn (X)" : `Player <span class="${playerClass}">${currentPlayer}</span>'s Turn`;
      statusText.innerHTML = label;
    }

    function checkWinPattern(currentBoard, player) {
      for (let pattern of winPatterns) {
        if (pattern.every(index => currentBoard[index] === player)) {
          return pattern;
        }
      }
      return null;
    }

    function checkDraw(currentBoard) {
      return currentBoard.every(cell => cell !== "");
    }

    function getBestMove(newBoard) {
      let bestScore = -Infinity;
      let move = null;

      for (let i = 0; i < 9; i++) {
        if (newBoard[i] === "") {
          newBoard[i] = "O";
          let score = minimax(newBoard, 0, false);
          newBoard[i] = "";
          if (score > bestScore) {
            bestScore = score;
            move = i;
          }
        }
      }
      return move;
    }

    function minimax(newBoard, depth, isMaximizing) {
      if (checkWinPattern(newBoard, "O")) return 10 - depth;
      if (checkWinPattern(newBoard, "X")) return depth - 10;
      if (checkDraw(newBoard)) return 0;

      if (isMaximizing) {
        let bestScore = -Infinity;
        for (let i = 0; i < 9; i++) {
          if (newBoard[i] === "") {
            newBoard[i] = "O";
            let score = minimax(newBoard, depth + 1, false);
            newBoard[i] = "";
            bestScore = Math.max(score, bestScore);
          }
        }
        return bestScore;
      } else {
        let bestScore = Infinity;
        for (let i = 0; i < 9; i++) {
          if (newBoard[i] === "") {
            newBoard[i] = "X";
            let score = minimax(newBoard, depth + 1, true);
            newBoard[i] = "";
            bestScore = Math.min(score, bestScore);
          }
        }
        return bestScore;
      }
    }
    cells.forEach(cell => cell.addEventListener('click', handleCellClick));
  </script>
</body>
